name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp windows.html www/index.html
          cp style.css mouse.js www/

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icon
        run: |
          npm install -D cordova-res
          npx cordova-res android --skip-config --resources-directory resources --icon-source "Cat gray and pink cat.jpg"
          cp -r resources/android/icon/* android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xodos-os-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
